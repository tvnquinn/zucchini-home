<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f0e7">
  <title>Zucchini’s places</title>
  <style>
    :root{color:#382d2e;background:#f7f0e7;font-family:system-ui,-apple-system,sans-serif;font-size:16px}
    *{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:20px max(14px,env(safe-area-inset-left)) 30px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:-.04em}
    a{color:#203653;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}
    nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #d9c5b2;background:#fffaf3;border-radius:10px;padding:10px 13px;min-height:44px;font-size:14px;font-weight:600}button[aria-pressed=true]{background:#203653;color:white;border-color:#203653}button:focus-visible,a:focus-visible{outline:3px solid #b57c45;outline-offset:3px}
    .scene-grid{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:22px;align-items:start}
    .scene{min-width:0}canvas#screen{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#e8e0d1;border-radius:14px;image-rendering:pixelated;box-shadow:0 12px 28px #80543a20}
    canvas#screen.arranging{touch-action:none;cursor:grab}canvas#screen.arranging:active{cursor:grabbing}.arrange-tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 10px}.arrange-tools button:disabled{opacity:.45;cursor:default}.arrange-tools strong{font-size:13px;flex:1 1 100%}.edit-hint{font-size:12px;margin:4px 0 8px;color:#716158}.scene-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}h2{font-size:21px;margin:0;letter-spacing:-.02em}.status{font-size:12px;color:#685b51;background:#eee4d7;border-radius:20px;padding:5px 10px;font-weight:650}
    p{line-height:1.45;color:#716158;margin:10px 0;font-size:14px}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.object{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:100px;padding:7px 4px;font-size:12px;text-align:center}.object canvas{width:64px;height:62px;image-rendering:pixelated}
    .object[aria-pressed=true]{background:#e6ddcf;color:#382d2e;border-color:#997d63}.object[aria-pressed=true] canvas{background:transparent}#note{min-height:42px}.description{margin-top:6px}
    @media(max-width:760px){.scene-grid{grid-template-columns:1fr;gap:16px}.objects{grid-template-columns:repeat(3,minmax(0,1fr))}nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}nav button{flex-shrink:0}.object{min-height:88px}header{align-items:flex-start}}
  </style>
</head>
<body data-art-base="../assets/destinations-79edfabf376e/">
<main>
  <header><h1>Zucchini’s places</h1><a id="back" href="../">← Home</a></header>
  <nav id="tabs" aria-label="Choose a destination"></nav>
  <div class="scene-grid">
    <section class="scene">
      <div class="scene-heading"><h2 id="title">Loading places…</h2><span class="status" id="status"></span></div>
      <div class="arrange-tools"><button id="arrange" aria-pressed="false" disabled>Arrange</button><strong id="selected" aria-live="polite"></strong><div id="edit-controls" hidden><button id="rotate" disabled>Rotate</button> <button id="undo" disabled>Undo</button> <button id="reset-layout">Reset layout</button></div></div>
      <p id="edit-hint" class="edit-hint" hidden>Tap an object, then drag it or tap a new spot. Green means it fits. You can also use the arrow keys.</p>
      <canvas id="screen" width="480" height="320" tabindex="0" role="img" aria-label="Destination layout"></canvas>
      <p class="description" id="description">Explore the furnished layouts. This preview does not spend an activity invitation.</p>
      <p id="error" role="alert"></p>
    </section>
    <aside>
      <h2>Scene objects</h2>
      <p>Choose an individual object to see or arrange it.</p>
      <div id="objects" class="objects"></div>
      <p id="note" aria-live="polite"></p>
    </aside>
  </div>
</main>
<script type="module">
import {placeLayoutKey,readPlaceLayouts,placeFacings,placeBox,placeAnchorValid,placeMovable,resolvePlaceLayout,placePlacementValid,placeTransforms} from "../releases/82ee4863f6b4/places_layout.js";
const $=id=>document.getElementById(id), base=document.body.dataset.artBase;
const canvas=$("screen"),ctx=canvas.getContext("2d"), images=new Map(), embedded=globalThis.zucchiniPlaceEmbedded;
const accessNotes={park:"Run",neighborhood:"20,000 steps",beach:"All three workout types",office:"Office day",agility:"Gym"};
const descriptions={
  park:"The playable Run outing: keep the native bench and sniffing spots in place; move decorative trees and reeds or rotate the objects.",
  neighborhood:"A quiet San Francisco block with Victorian houses, curbside amenities and three street trees. The front steps remain clear.",
  beach:"Coastal views, an umbrella and chair, boardwalk, shells, driftwood and a sandcastle.",
  office:"A wall-aligned workstation with a chair facing the desk, mug and badge on the desktop, and a snack drawer and mini desk along the opposite wall.",
  agility:"Follow the U-shaped course: jump, weave poles, tunnel, ramp and hoop."
};
const query=new URLSearchParams(location.search), trial=query.get("from")==="trial";
if(trial) $("back").href=embedded?"../zucchini-trial.html":"../trial/";
const storageKey=placeLayoutKey(trial);
let manifest,scene,atlas,dog,sceneId,placements=[],selection=null,assetSelection=null,revision=0,arranging=false,drag=null;
const undoHistory=new Map();
const getImage=async name=>{
  if(!images.has(name)){
    const promise=new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=embedded?.images[name]??base+name;});
    images.set(name,promise);promise.catch(()=>images.delete(name));
  }
  return images.get(name);
};
function chosen(){return placements.find(p=>p.placementId===selection);}
function label(p){
  const matching=placements.filter(q=>q.object===p.object),i=matching.findIndex(q=>q.placementId===p.placementId);
  return scene.objects[p.object].title+(matching.length>1?" "+(i+1):"");
}
function layersFor(list){
  return list.map(p=>({p,f:scene.objects[p.object].frames[p.facing],src:atlas,z:p.y+(p.surface?50:0),box:placeBox(scene,p)})).sort((a,b)=>a.z-b.z);
}
function replacing(candidate){
  const next=placements.map(p=>p.placementId===candidate.placementId?{...candidate}:{...p});
  for(const p of next)if(p.mountedOn===candidate.placementId){
    const [dx,dy]=p.mountOffsets?.[candidate.facing]??[p.x-candidate.x,p.y-candidate.y];
    p.x=candidate.x+dx;p.y=candidate.y+dy;
  }
  return next;
}
function draw(now){
  if(!scene||!atlas||!dog)return;
  ctx.imageSmoothingEnabled=false;ctx.drawImage(atlas,...scene.background,0,0,480,320);
  const list=drag?.candidate?replacing(drag.candidate):placements;
  const layers=layersFor(list);
  const [x,y,scale]=scene.dog, sc=scale*manifest.dog.scale;
  const frame=manifest.dog.frames[Math.floor(now/400)%manifest.dog.frames.length];
  layers.push({f:{rect:frame},src:dog,z:y,box:[x-manifest.dog.anchor[0]*sc,y-manifest.dog.anchor[1]*sc,frame[2]*sc,frame[3]*sc]});
  layers.sort((a,b)=>a.z-b.z);
  for(const layer of layers)ctx.drawImage(layer.src,...layer.f.rect,...layer.box);
  if(selection){
    ctx.strokeStyle=drag?.candidate?(drag.valid?"#337c42":"#c94539"):(arranging?"#203653":"#fffaf3");
    ctx.lineWidth=2;ctx.setLineDash([4,4]);
    for(const l of layers)if(l.p?.placementId===selection)ctx.strokeRect(l.box[0]-2,l.box[1]-2,l.box[2]+4,l.box[3]+4);
    ctx.setLineDash([]);
  }
}
function updateControls(){
  const p=chosen(), options=p?placeFacings(scene,p):[];
  $("arrange").textContent=arranging?"Done arranging":"Arrange";
  $("arrange").setAttribute("aria-pressed",String(arranging));
  $("edit-controls").hidden=$("edit-hint").hidden=!arranging;
  canvas.classList.toggle("arranging",arranging);
  $("selected").textContent=p?label(p):"";
  $("rotate").disabled=!arranging||options.length<2;
  $("rotate").textContent=options.length===2?"Rotate 180°":"Rotate 90°";
  $("undo").disabled=!(undoHistory.get(sceneId)?.length);
  for(const b of $("objects").children)b.setAttribute("aria-pressed",String(b.dataset.placement===selection||b.dataset.asset===assetSelection));
  if(p)$("note").textContent=p.fixedPosition?"This object can rotate, but its park gameplay position is fixed.":p.mountedOn?"Moves with the desk. You can rotate it separately.":arranging?"Drag to a new spot, or tap a clear location.":scene.objects[p.object].title;
  else $("note").textContent=assetSelection?scene.objects[assetSelection]?.note||"Structural art, not a movable item.":"";
}
function pick(id){
  selection=id;assetSelection=null;updateControls();
}
function objectButtons(){
  $("objects").replaceChildren();
  const createButton=(obj,caption,p)=>{
    const button=document.createElement("button");button.className="object";button.setAttribute("aria-pressed","false");
    const thumb=document.createElement("canvas");thumb.width=64;thumb.height=62;
    const c=thumb.getContext("2d"),r=obj.frames[p?.facing??"SE"].rect,scale=Math.min(58/r[2],54/r[3]);
    c.imageSmoothingEnabled=false;c.drawImage(atlas,...r,(64-r[2]*scale)/2,(62-r[3]*scale)/2,r[2]*scale,r[3]*scale);
    const label=document.createElement("span");label.textContent=caption;
    button.append(thumb,label);
    if(p){button.dataset.placement=p.placementId;button.onclick=()=>pick(p.placementId);}
    else{button.dataset.asset=Object.keys(scene.objects).find(key=>scene.objects[key]===obj);button.onclick=()=>{selection=null;assetSelection=button.dataset.asset;updateControls();};}
    $("objects").append(button);
  };
  for(const p of placements)createButton(scene.objects[p.object],label(p),p);
  for(const [id,obj] of Object.entries(scene.objects))if(!placements.some(p=>p.object===id))createButton(obj,obj.title);
}
function commitLayout(next,recordUndo=true){
  const old=placeTransforms(scene,placements), updated=placeTransforms(scene,next);
  if(JSON.stringify(old)===JSON.stringify(updated))return false;
  try{
    const latest=readPlaceLayouts(localStorage,trial);
    latest[sceneId]=updated;
    localStorage.setItem(storageKey,JSON.stringify(latest));
  }catch{
    $("error").textContent="Could not save this arrangement. The previous layout is unchanged.";return false;
  }
  if(recordUndo){
    const hist=undoHistory.get(sceneId)??[];hist.push(old);if(hist.length>25)hist.shift();undoHistory.set(sceneId,hist);
  }
  placements=resolvePlaceLayout(scene,updated);$("error").textContent="";
  objectButtons();updateControls();return true;
}
function moveTo(p,x,y){
  if(!p||!placeMovable(p))return false;
  const next={...p,x:Math.round(x),y:Math.round(y)};
  if(!placePlacementValid(scene,placements,next)){$("note").textContent="That spot is blocked, outside the floor, or too close to another object.";return false;}
  return commitLayout(replacing(next));
}
$("arrange").onclick=()=>{arranging=!arranging;drag=null;updateControls();};
$("rotate").onclick=()=>{
  const p=chosen();if(!p||!arranging)return;
  const options=placeFacings(scene,p), facing=options[(options.indexOf(p.facing)+1)%options.length];
  const candidate={...p,facing};
  if(!placeAnchorValid(scene,candidate)){$("note").textContent="Move the object inward before rotating it.";return;}
  commitLayout(replacing(candidate));
};
$("undo").onclick=()=>{
  const hist=undoHistory.get(sceneId);if(!hist?.length)return;
  if(commitLayout(resolvePlaceLayout(scene,hist[hist.length-1]),false)){hist.pop();updateControls();}
};
$("reset-layout").onclick=()=>commitLayout(resolvePlaceLayout(scene));
function pointerPoint(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*320/r.height];
}
function atPoint(x,y){
  return layersFor(placements).reverse().find(l=>x>=l.box[0]&&x<=l.box[0]+l.box[2]&&y>=l.box[1]&&y<=l.box[1]+l.box[3])?.p;
}
canvas.addEventListener("pointerdown",e=>{
  if(!scene||e.button!==0)return;
  const [x,y]=pointerPoint(e),hit=atPoint(x,y), prior=chosen();
  if(hit){pick(hit.placementId);if(arranging&&placeMovable(hit)){
    drag={pointer:e.pointerId,original:hit,start:[x,y],candidate:null,valid:true};
    canvas.setPointerCapture?.(e.pointerId);e.preventDefault();
  }}else if(arranging&&prior&&placeMovable(prior)){moveTo(prior,x,y);}
});
canvas.addEventListener("pointermove",e=>{
  if(!drag||drag.pointer!==e.pointerId)return;
  const [x,y]=pointerPoint(e);
  if(!drag.candidate&&Math.hypot(x-drag.start[0],y-drag.start[1])<4)return;
  drag.candidate={...drag.original,x:Math.round(drag.original.x+x-drag.start[0]),y:Math.round(drag.original.y+y-drag.start[1])};
  drag.valid=placePlacementValid(scene,placements,drag.candidate);
});
canvas.addEventListener("pointerup",e=>{
  if(!drag||drag.pointer!==e.pointerId)return;
  const {candidate,valid}=drag;drag=null;
  if(candidate&&valid)commitLayout(replacing(candidate));
  else if(candidate)$("note").textContent="That spot is blocked; the object stayed in its previous place.";
});
canvas.addEventListener("pointercancel",()=>{drag=null;});
canvas.addEventListener("keydown",e=>{
  if(!arranging||!chosen())return;
  const delta={ArrowLeft:[-4,0],ArrowRight:[4,0],ArrowUp:[0,-4],ArrowDown:[0,4]}[e.key];
  if(delta){e.preventDefault();const p=chosen();moveTo(p,p.x+delta[0],p.y+delta[1]);}
});
addEventListener("storage",e=>{
  if(e.key!==storageKey||!scene)return;drag=null;
  placements=resolvePlaceLayout(scene,readPlaceLayouts(localStorage,trial)[sceneId]);
  undoHistory.delete(sceneId);objectButtons();updateControls();
});
async function show(id){
  const token=++revision,s=manifest.scenes[id];if(!s)return;
  try{
    const image=await getImage(s.image);if(token!==revision)return;
    scene=s;sceneId=id;atlas=image;selection=null;assetSelection=null;drag=null;$("arrange").disabled=false;
    placements=resolvePlaceLayout(s,readPlaceLayouts(localStorage,trial)[id]);
    $("note").textContent="";$("error").textContent="";
    $("title").textContent=s.title;$("status").textContent="Playable · "+accessNotes[id];
    $("description").textContent=descriptions[id]+" Arrange the layout here; visit it in the game under Ready to visit once earned.";
    canvas.setAttribute("aria-label",s.title+" with Zucchini and all placed scenery");
    for(const b of $("tabs").children)b.setAttribute("aria-pressed",String(b.dataset.scene===id));
    objectButtons();updateControls();draw(performance.now());
  }catch{$("error").textContent="Could not load this scene. Tap its name to retry.";}
}
async function main(){
  if(embedded)manifest=embedded.manifest;
  else {const r=await fetch(base+"destinations.json");if(!r.ok)throw Error("Could not load the places.");manifest=await r.json();}
  if(manifest.schema!==1)throw Error("Unsupported places layout.");
  dog=await getImage(manifest.dog.image);
  for(const [id,s] of Object.entries(manifest.scenes)){
    const b=document.createElement("button");b.dataset.scene=id;b.textContent=s.title;b.setAttribute("aria-pressed","false");b.onclick=()=>show(id);$("tabs").append(b);
  }
  await show(manifest.scenes[query.get("scene")]?query.get("scene"):"park");
  const frame=now=>{draw(now);requestAnimationFrame(frame);};requestAnimationFrame(frame);
}
main().catch(e=>$("error").textContent=e.message);
</script>
</body>
</html>
